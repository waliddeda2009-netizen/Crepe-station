<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Crepe Station Dashboard</title>


<link rel="stylesheet" href="css/dashboard.css">



<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>



<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">



<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>



<body>




<!-- =========================
          HEADER
========================= -->


<header class="header">


<div class="logo">


<img src="images/logo.png" alt="Logo">


<h2>

Crepe Station <span>Admin</span>

</h2>


</div>





<button id="logoutBtn">


<i class="fa-solid fa-right-from-bracket"></i>


Logout


</button>



</header>









<!-- =========================
        DASHBOARD CARDS
========================= -->


<div class="dashboard">






<!-- PRODUCTS -->


<div class="card" id="productsCard">


<i class="fa-solid fa-burger"></i>


<h3>

Products

</h3>



<p>

Add - Edit - Delete Products

</p>



</div>








<!-- OFFERS -->


<div class="card" id="offersCard">


<i class="fa-solid fa-tags"></i>


<h3>

Offers

</h3>



<p>

Add - Edit - Delete Offers

</p>



</div>








<!-- EXTRAS -->


<div class="card" id="extrasCard">


<i class="fa-solid fa-plus"></i>


<h3>

Extras

</h3>



<p>

Add - Edit - Delete Extras

</p>



</div>








<!-- CATEGORIES -->


<div class="card" id="categoriesCard">


<i class="fa-solid fa-layer-group"></i>


<h3>

Categories

</h3>



<p>

Add - Edit - Delete Categories

</p>



</div>






</div>








<!-- =========================
            FOOTER
========================= -->


<footer class="footer">


<p>

© 2026 Crepe Station - Admin Panel

</p>


</footer>







<script type="module" src="js/dashboard.js"></script>



</body>


</html>
