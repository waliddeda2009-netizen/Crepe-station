<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Categories | Crepe Station</title>


<link rel="stylesheet" href="css/categories.css">


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>



<body>




<!-- =========================
            HEADER
========================= -->


<header class="header">


<div class="logo">


<img src="images/logo.png" alt="Logo">


<h2>

Crepe Station <span>Categories</span>

</h2>


</div>





<div class="header-buttons">


<a href="dashboard.html">


<i class="fa-solid fa-arrow-left"></i>


Dashboard


</a>





<button id="logoutBtn">


<i class="fa-solid fa-right-from-bracket"></i>


Logout


</button>



</div>



</header>









<!-- =========================
            MAIN
========================= -->


<main class="container">



<div class="glass-card">





<h2>

<i class="fa-solid fa-layer-group"></i>

Manage Categories

</h2>








<!-- ADD CATEGORY -->


<form id="categoryForm">



<input

type="text"

id="categoryName"

placeholder="Category Name"

required>





<button

type="submit"

id="saveCategoryBtn">


Add Category


</button>



</form>









<!-- CATEGORIES LIST -->


<h3 class="title">

Categories

</h3>



<div id="categoriesList">


<!-- Categories From Firebase -->


</div>









<!-- PRODUCTS INSIDE CATEGORY -->


<h3 class="title">

Category Products

</h3>



<div id="categoryProducts">


<!-- Products appear here -->

</div>







</div>



</main>









<!-- =========================
            FOOTER
========================= -->


<footer class="footer">


<p>

© 2026 Crepe Station - Categories Panel

</p>


</footer>







<script type="module" src="js/categories.js"></script>



</body>


</html>
